name: pose_snap_ai
description: "PoseSnap AI - AI-powered camera application suggesting trendy poses for stunning photos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI & Styling
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.8

  # Storage & Preferences
  shared_preferences: ^2.2.3

  # Utility & Models
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
